name: release
# build-machine: skip test reason=the ci workflow tests the tagged commit on main before the tag is pushed
# build-machine: skip smoke reason=the sidecar has no application to start; its tests run the binary with a test application

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The core release whose sok builds the sidecar release; it is unrelated to the version this repository releases.
env:
  CORE_RELEASE: v0.0.14

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ env.CORE_RELEASE }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Build and package
        run: make release SOK="$RUNNER_TEMP/sok" OUT=dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
