[package]
name = "soksak-app"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The application sidecar of soksak: it starts an application, hands its frames to an image region and passes the input of the page to it."

[[bin]]
name = "soksak-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "net", "process", "signal", "sync", "time"] }
soksak-embed = { git = "https://github.com/soksak-app/kit-embed.git", tag = "v0.0.1" }
